name: Package release gate

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '0.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record the Swift toolchain
        run: swift --version

      - name: Validate package, products, tests, and local consumer
        run: scripts/validate-release.sh

      - name: Confirm a release tag belongs to remote main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Resolve the tagged private package as an external consumer
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SABELLA_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64)
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
            scripts/validate-release-consumer.sh --remote

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate
    runs-on: [self-hosted, linux, x64, helix]
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v6

      - name: Build deterministic source archive and checksum
        run: |
          scripts/create-release-archive.sh \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$RUNNER_TEMP/release-assets"

      - name: Publish the immutable private GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Sabella $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            "$RUNNER_TEMP/release-assets/Sabella-$GITHUB_REF_NAME.tar.gz#Deterministic source archive" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS#SHA-256 checksum"
